name: CI

# Every push and every pull request: the tests, the formatter, no warnings.
# And, on Windows, the two things that are compiled from C there - the
# serial port program and the launcher - so that a Windows build that no
# longer builds is found on the push that broke it and not on the day of a
# release.
#
# And the contracts of the programs Alnasl talks to (OpenPairings, Arkab,
# OpenResults), compared with the providers' current ones: on every push,
# and once a day, since a provider moves without Alnasl having a commit.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    if: github.event_name != 'schedule'
    # Named, not `ubuntu-latest`: that label moves, and it should move here
    # when somebody decides it does.
    runs-on: ubuntu-24.04

    steps:
      # Actions are pinned to a commit, not to a tag: a tag can be moved, and
      # whoever moves it runs their code here. The comment is the version a
      # person reads; .github/dependabot.yml keeps the pair current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-otp29.0-ex1.20-

      # --check-locked: a constraint edited in mix.exs without the lock file
      # would otherwise be resolved here, silently, into a set of
      # dependencies nobody committed.
      - name: Install dependencies
        run: mix deps.get --check-locked

      # The serial library is on by default on Linux, so this compiles it.
      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Audit dependencies
        run: |
          mix deps.audit
          mix hex.audit

      - name: Sobelow
        # Findings reviewed in context live in .sobelow-skips; a NEW finding fails here.
        run: mix sobelow --config

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      # The installer scripts run as root on somebody's box and cannot be
      # run here. They can at least be read by something stricter than sh.
      - name: Lint the Linux installer scripts
        run: |
          for script in rel/linux/*.sh; do
            sh -n "$script"
          done
          shellcheck --shell=sh --severity=warning rel/linux/*.sh

  e2e:
    # The browser tests (test/e2e, docs/e2e.md): the real endpoint and a real
    # headless Chromium, for what only runs in a browser - the guided tour.
    # A job of its own, so the suite above does not wait on a browser download.
    name: Browser tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-e2e-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-e2e-otp29.0-ex1.20-

      # Keyed on the lockfile, which pins Playwright, which pins the browser
      # build: a Playwright bump is a fresh download, never a driver talking
      # to a browser it does not know.
      - name: Restore the Playwright browser cache
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      # Node comes with the runner image.
      - name: Install Playwright
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Download the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium-headless-shell

      # apt packages, so not in the cache above.
      - name: Install the browser's system libraries
        working-directory: e2e
        run: npx playwright install-deps chromium-headless-shell

      - name: Install dependencies
        run: mix deps.get --check-locked

      # A failure runs the failed tests again with a trace and a screenshot
      # each, for the artifact below; the step stays red either way.
      - name: Run the browser tests
        run: |
          mix test.e2e && exit 0
          PW_TRACE=true PW_SCREENSHOT=true mix test.e2e --failed || true
          exit 1

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: _build/e2e/
          if-no-files-found: ignore
          retention-days: 7

  dialyzer:
    name: Dialyzer
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-dialyzer-build-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-build-otp29.0-ex1.20-

      # The PLT is the slow part (minutes); keyed on OTP, Elixir and the lock
      # so that it is rebuilt only when one of them moves.
      - name: Restore the PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Build the PLTs
        run: mix dialyzer --plt

      # A finding fails the build; what is not ours is in .dialyzer_ignore.exs.
      - name: Dialyzer
        run: mix dialyzer --format github

  windows:
    name: Windows builds (serial program, launcher)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    env:
      # On Windows the serial library is asked for, not assumed (mix.exs).
      ALNASL_UART: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not setup-beam: see the script.
      - name: Erlang/OTP and Elixir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/install-beam-windows.ps1 -Otp 29.0.5 -Elixir 1.20.4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # No zig cache: a cancelled run saved half of one, and every run
          # after it restored the half, failed to link, and saved another
          # half (2026-10-20). The launcher builds in seconds without it.
          use-cache: false

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp29.0.5-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-otp29.0.5-ex1.20-

      # circuits_uart is built with mingw-w64: `gcc` and `mingw32-make`, both
      # on the runner image's PATH. If an image ever drops them, this says
      # so in one line instead of in the middle of a make error.
      - name: Check the C toolchain
        shell: pwsh
        run: |
          gcc --version | Select-Object -First 1
          mingw32-make --version | Select-Object -First 1

      - run: mix deps.get --check-locked

      - run: mix compile --warnings-as-errors

      - name: Check the serial program was built
        shell: pwsh
        run: |
          $exe = "_build\dev\lib\circuits_uart\priv\circuits_uart.exe"
          if (-not (Test-Path $exe)) { throw "No $exe - the serial library did not build." }
          Get-Item $exe | Select-Object Name, Length

      - name: Build the launcher
        shell: pwsh
        run: |
          .\rel\windows\build_launcher.ps1 -OutputPath "$env:RUNNER_TEMP\Alnasl.exe"

  contracts:
    name: Contracts match their providers
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-contracts-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-contracts-otp29.0-ex1.20-

      - run: mix deps.get --check-locked

      # Fetches each provider's contract from GitHub and fails, naming the
      # files, if it is not byte for byte the vendored copy. The fix is
      # `mix contracts.sync`, the tests, and whatever they then say.
      - name: Compare the vendored contracts with the providers'
        run: mix contracts.check
